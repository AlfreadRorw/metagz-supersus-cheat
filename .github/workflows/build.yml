name: Build METAGZ Cheat APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager --update || true
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list | head -50
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: find . -type f -name "*.apk"

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/METAGZ_Cheat_v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: METAGZ-Supersus-Cheat
          path: output/METAGZ_Cheat_v2.apk
          retention-days: 30